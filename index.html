<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

</head>

<body>

            <tr>
                <td>Samsung A14</td>

                <td>No</td>
            </tr>

            <tr>
                <td>HP Laptop 15</td>
                <td rowspan="2">Laptop</td>
                <td>$650</td>
                <td>Yes</td>
            </tr>

            <tr>
                <td>MacBook Pro</td>
                <td>$1200</td>

            </tr>

        </tbody>

        <!-- Table Footer -->
        <tfoot>
            <tr>
                <td colspan="4" style="text-align: center;">Total Products: 4</td>
            </tr>
        </tfoot>

    </table>

</body>
